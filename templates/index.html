<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Maze Solver 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="theme-game">
    <div class="container">
        <!-- App Switcher Nav -->
        <nav class="app-switcher">
            <div class="app-tab active" data-theme="theme-game" title="Game AI Pathfinding">
                <span class="app-icon">👾</span>
                <span class="app-label">Game AI</span>
            </div>
            <div class="app-tab" data-theme="theme-gps" title="Smart Navigation Systems (GPS Routing)">
                <span class="app-icon">🗺️</span>
                <span class="app-label">GPS Route</span>
            </div>
            <div class="app-tab" data-theme="theme-warehouse" title="Warehouse Robot Path Planning">
                <span class="app-icon">🤖</span>
                <span class="app-label">Warehouse</span>
            </div>
            <div class="app-tab" data-theme="theme-network" title="Network Packet Routing">
                <span class="app-icon">🌐</span>
                <span class="app-label">Network</span>
            </div>
            <div class="app-tab" data-theme="theme-evac" title="Emergency Evacuation Planning">
                <span class="app-icon">🚨</span>
                <span class="app-label">Evacuation</span>
            </div>
        </nav>

        <aside class="sidebar">
            <div class="logo-container">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#neon-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff00cc" />
                            <stop offset="100%" stop-color="#3333ff" />
                        </linearGradient>
                    </defs>
                    <path d="M4 4h16v16H4z"/>
                    <path d="M9 4v8M15 12v8M4 12h5M15 12h5"/>
                </svg>
                <h1>Maze Solver</h1>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="algorithm">Solving Algorithm</label>
                    <div class="select-wrapper">
                        <select id="algorithm">
                            <option value="dfs">Depth-First Search (DFS)</option>
                            <option value="bfs">Breadth-First Search (BFS)</option>
                            <option value="dijkstra">Dijkstra's Algorithm</option>
                            <option value="astar">A* Search</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grid Size</label>
                    <div class="size-controls">
                        <input type="number" id="width" value="41" min="11" max="101" step="2" />
                        <span>×</span>
                        <input type="number" id="height" value="41" min="11" max="101" step="2" />
                    </div>
                </div>

                <button id="generate-btn" class="btn primary-btn">
                    <span>Generate New Maze</span>
                    <div class="btn-glow"></div>
                </button>

                <div class="sandbox-controls">
                    <label>Interactive Sandbox</label>
                    <div class="btn-group">
                        <button id="draw-btn" class="btn tool-btn active" title="Draw Walls">🧱 Draw</button>
                        <button id="erase-btn" class="btn tool-btn" title="Erase Walls (Make Path)">🧹 Erase</button>
                    </div>
                    <div class="btn-group">
                        <button id="blank-btn" class="btn action-btn">Blank Canvas</button>
                        <button id="clear-sol-btn" class="btn action-btn">Clear Solution</button>
                    </div>
                </div>

                <button id="solve-btn" class="btn secondary-btn" disabled>
                    <span>Solve Maze</span>
                </button>
                
                <div class="unique-controls">
                    <button id="toggle-3d-btn" class="btn cyberpunk-btn">
                        <span>Toggle 3D View</span>
                    </button>
                    <button id="export-btn" class="btn export-btn">
                        <span>📸 Export Image</span>
                    </button>
                </div>
            </div>

            <div class="stats-panel" id="stats-panel" style="display: none;">
                <h3>Results</h3>
                <div class="stat">
                    <span class="stat-label">Algorithm:</span>
                    <span class="stat-value" id="stat-algo">-</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time:</span>
                    <span class="stat-value" id="stat-time">-</span>
                </div>
            </div>
            
            <div class="github-link">
                <a href="https://github.com/YeyoM/mazeSolver" target="_blank">View on GitHub</a>
            </div>
        </aside>

        <main class="maze-container">
            <div class="maze-wrapper" id="maze-wrapper">
                <div class="placeholder-text">Generating maze...</div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
